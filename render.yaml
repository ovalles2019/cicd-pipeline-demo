# Render Blueprint — QA / Staging / Production (prebuilt GHCR images).
# CI builds once, pushes to GHCR, then deploy jobs pull that image
# (Deploy Hook ?imgURL=… or API imageUrl — see docs/deploy.md).
# Free services spin down after ~15 min idle.
#
# Docs: https://render.com/docs/blueprint-spec
#       https://render.com/docs/deploying-an-image
#
# Private GHCR packages: add a Registry Credential in the Render Dashboard
# (read:packages PAT) named `ghcr-credentials`, then uncomment image.creds
# on each service below.

services:
  - type: web
    name: cicd-demo-qa
    runtime: image
    plan: free
    region: oregon
    autoDeployTrigger: off
    image:
      url: ghcr.io/ovalles2019/cicd-pipeline-demo:qa
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr-credentials
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: qa
      - key: APP_NAME
        value: cicd-pipeline-demo

  - type: web
    name: cicd-demo-staging
    runtime: image
    plan: free
    region: oregon
    autoDeployTrigger: off
    image:
      url: ghcr.io/ovalles2019/cicd-pipeline-demo:qa
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr-credentials
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: cicd-pipeline-demo

  - type: web
    name: cicd-demo-production
    runtime: image
    plan: free
    region: oregon
    autoDeployTrigger: off
    image:
      url: ghcr.io/ovalles2019/cicd-pipeline-demo:latest
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr-credentials
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: cicd-pipeline-demo
