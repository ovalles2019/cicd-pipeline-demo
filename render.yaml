# Render Blueprint — QA / Staging / Production (Docker runtime).
# Deployments are triggered by GitHub Actions (autoDeploy off per service
# when created via API, or use Deploy Hooks — see docs/deploy.md).
# Free services spin down after ~15 min idle.
#
# Services build from the repo's Dockerfile, matching the CI pipeline.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cicd-demo-qa
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/OWNER/REPO  # Update with your repo URL
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: qa
      - key: APP_NAME
        value: cicd-pipeline-demo

  - type: web
    name: cicd-demo-staging
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/OWNER/REPO  # Update with your repo URL
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: cicd-pipeline-demo

  - type: web
    name: cicd-demo-production
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/OWNER/REPO  # Update with your repo URL
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: cicd-pipeline-demo
