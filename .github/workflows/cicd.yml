# Modern CI/CD pipeline matching the learning diagram:
#   Developer → GitHub → Source (lint) → Build (image + unit + coverage)
#   → Test (integration) → Release (GHCR) → Deploy (QA → Staging → Production)
#
# Jobs map 1:1 to those stages so the Actions graph reads like the flowchart.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Source: commit checks / linting ──────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff==0.11.6

      - name: Ruff check
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

  # ── Build: unit tests + coverage gate (80%) ─────────────────────────────
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -v

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests with coverage gate (≥80%)
        run: |
          pytest tests/unit \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── Build: compile / container image ─────────────────────────────────────
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=build-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image (no push yet)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            cicd-demo:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name smoke -e APP_ENV=ci -e PORT=8000 -p 8000:8000 cicd-demo:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Health check passed"
              docker stop smoke
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          docker stop smoke || true
          exit 1

  # ── Build quality gate: container vulnerability scan ────────────────────
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild image for scan (uses GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cicd-demo:ci
          cache-from: type=gha

      - name: Scan image with Trivy (CRITICAL/HIGH, ignore unfixed)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: cicd-demo:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

  # ── Test: integration ───────────────────────────────────────────────────
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    needs: [unit-tests, build-image, security-scan]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/integration -v

  # ── Release: ship image to registry (main only) ─────────────────────────
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [coverage, integration-tests, build-image, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=qa
            type=raw,value=latest

      - name: Build and push to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export short SHA tag
        id: tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # ── Deploy: QA (auto on main) ───────────────────────────────────────────
  deploy-qa:
    name: deploy-qa
    runs-on: ubuntu-latest
    needs: [release]
    environment:
      name: qa
      url: ${{ vars.QA_URL }}
    steps:
      - name: Deploy image tag to QA
        env:
          RENDER_DEPLOY_HOOK_QA: ${{ secrets.RENDER_DEPLOY_HOOK_QA }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_QA: ${{ vars.RENDER_SERVICE_ID_QA }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.image_tag }}
        run: |
          echo "Promoting $IMAGE → QA"
          if [ -n "$RENDER_DEPLOY_HOOK_QA" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_QA"
            echo "QA deploy hook triggered."
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID_QA" ]; then
            curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_QA}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}'
            echo "QA deploy triggered via Render API."
          else
            echo "::notice::No Render credentials — simulating QA deploy for $IMAGE"
          fi

  # ── Deploy: Staging (manual approval via GitHub Environment) ────────────
  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    needs: [deploy-qa]
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Promote QA image to Staging
        env:
          RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_STAGING: ${{ vars.RENDER_SERVICE_ID_STAGING }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa
        run: |
          echo "Promoting $IMAGE → Staging"
          if [ -n "$RENDER_DEPLOY_HOOK_STAGING" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_STAGING"
            echo "Staging deploy hook triggered."
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID_STAGING" ]; then
            curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_STAGING}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}'
            echo "Staging deploy triggered via Render API."
          else
            echo "::notice::No Render credentials — simulating Staging deploy for $IMAGE"
          fi

  # ── Deploy: Production (manual approval via GitHub Environment) ─────────
  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Promote Staging image to Production
        env:
          RENDER_DEPLOY_HOOK_PRODUCTION: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_PRODUCTION: ${{ vars.RENDER_SERVICE_ID_PRODUCTION }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          echo "Promoting $IMAGE → Production"
          if [ -n "$RENDER_DEPLOY_HOOK_PRODUCTION" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_PRODUCTION"
            echo "Production deploy hook triggered."
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID_PRODUCTION" ]; then
            curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_PRODUCTION}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}'
            echo "Production deploy triggered via Render API."
          else
            echo "::notice::No Render credentials — simulating Production deploy for $IMAGE"
          fi
